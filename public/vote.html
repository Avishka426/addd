<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff2e93">
<title>Beast Vote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+Sinhala:wght@500;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <span class="brand">Beast Vote</span>
  <h1 class="title" id="title">…</h1>
  <p class="prompt" id="prompt"></p>

  <div id="status" class="card center" style="margin-bottom:16px"></div>

  <div id="voteArea" class="hidden">
    <div id="opts" class="opts"></div>
    <div class="spacer"></div>
    <div class="center"><button id="voteBtn" class="btn huge" disabled>Vote දාන්න</button></div>
  </div>

  <div id="reactBar" class="card center hidden" style="margin-top:16px">
    <div class="muted" style="margin-bottom:8px">Spam some reactions while you wait</div>
    <div class="row-gap" id="reacts"></div>
  </div>

  <div id="results"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/fx.js"></script>
<script>
const qid = location.pathname.split('/').pop();
const $ = (id) => document.getElementById(id);
let question, state, selected = null, offset = 0, tick, revealedShown = false;

// Votes stay on this phone – they are never sent to the server. A vote belongs to one
// voting round (identified by its end time), so a reset or a new round starts fresh.
let localVote = null;
const VOTE_KEY = 'bv_vote_' + qid;
function myVote(s) {
  if (!localVote) { try { localVote = JSON.parse(localStorage.getItem(VOTE_KEY)); } catch {} }
  return localVote && s && localVote.round === s.endsAt ? localVote.option : null;
}
function saveVote(s, option) {
  localVote = { round: s.endsAt, option };
  try { localStorage.setItem(VOTE_KEY, JSON.stringify(localVote)); } catch {}
}

const WAIT_LINES = ['Host තාම start කරලා නෑ', 'Popcorn අරන් එන්න', 'Ready වෙලා ඉන්න…'];

async function init() {
  question = await (await fetch('/api/questions/' + qid)).json();
  if (question.error) { $('title').textContent = 'Question not found'; return; }
  document.title = question.title + ' · Beast Vote';
  $('title').textContent = question.title;
  $('prompt').textContent = question.prompt;
  renderOptions();
  $('reacts').innerHTML = question.emojis.slice(0, 6).map((e) => `<button class="btn ghost small" data-e="${e}" style="font-size:24px;padding:8px 14px">${e}</button>`).join('');
  $('reacts').onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    // reactions are local only – nothing goes to the server
    const r = b.getBoundingClientRect(); FX.burst(r.left + r.width / 2, r.top, [b.dataset.e], 6);
    FX.floatEmoji(b.dataset.e, { size: 34 });
  };

  window.socket = io({ auth: { q: qid, role: 'voter' } });
  socket.on('state', (s) => { offset = s.now - Date.now(); state = s; render(); });
  socket.on('started', () => { FX.play('start.mp3', 0.7); FX.toast('Voting started! විනාඩි 3යි!'); });
  socket.on('ended', () => { FX.play('end.mp3', 0.8); FX.toast('Time\'s up! Reveal එකට wait කරන්න'); });
  socket.on('drumroll', () => {
    window.drum = FX.play('drumroll.mp3', 0.8);
    $('status').innerHTML = `<h3 style="animation:shake .4s infinite">Revealing…</h3>`;
  });
  socket.on('reset', () => { selected = null; revealedShown = false; $('results').innerHTML = ''; renderOptions(); });
}

function renderOptions() {
  const box = $('opts');
  box.className = 'opts ' + question.type;
  box.innerHTML = question.options.map((o, i) => question.type === 'image'
    ? `<button class="opt" data-i="${i}"><span class="num">${i + 1}</span><img src="${o.img}" alt="" loading="lazy"><span>${FX.esc(o.label)}</span></button>`
    : `<button class="opt" data-i="${i}">${o.img ? `<img class="avatar" src="${o.img}" alt="">` : `<span class="em">${o.emoji || ''}</span>`}<span>${FX.esc(o.label)}</span></button>`
  ).join('');
  box.onclick = (e) => {
    const b = e.target.closest('.opt');
    if (!b || box.classList.contains('locked')) return;
    selected = Number(b.dataset.i);
    box.querySelectorAll('.opt').forEach((x) => x.classList.toggle('sel', x === b));
    $('voteBtn').disabled = false;
    FX.play('pop3.mp3', 0.5);
  };
}

$('voteBtn').onclick = () => {
  if (selected == null || !state || state.status !== 'voting') return;
  if (myVote(state) != null) { FX.play('already.mp3'); FX.toast('ඔයා දැනටමත් vote කරලා – එක පාරයි!'); return; }
  saveVote(state, selected);
  FX.play('voted.mp3', 0.8);
  render();
};

function render() {
  clearInterval(tick);
  const s = state;
  const st = $('status');
  const box = $('opts');
  $('voteArea').classList.add('hidden');
  $('reactBar').classList.add('hidden');

  if (s.status === 'idle') {
    st.innerHTML = `<h3>${WAIT_LINES[Math.floor(Math.random() * WAIT_LINES.length)]}</h3><div class="muted">Voting පටන් ගත්තම මෙතන options පේනවා</div>`;
    $('results').innerHTML = '';
  } else if (s.status === 'voting') {
    const myOption = myVote(s);
    const voted = myOption != null;
    const mine = voted ? question.options[myOption] : null;
    const update = () => {
      const left = s.endsAt - (Date.now() + offset);
      st.innerHTML = voted
        ? `<h3>Vote එක දැම්මා!</h3>
           <div class="pill" style="margin:10px 0">ඔයා තේරුවේ: ${mine ? FX.esc(mine.label) : ''}</div>
           <div class="muted">Results secret · ${FX.fmt(left)} ඉතුරුයි · Big screen එකේ reveal එක බලාගෙන ඉන්න</div>`
        : `<h3>${FX.fmt(left)} ඉතුරුයි</h3><div class="muted">එකක් තෝරලා Vote කරන්න</div>`;
    };
    update(); tick = setInterval(update, 500);
    if (voted) {
      // vote done – hide the options so the phone just shows the confirmation
      selected = myOption;
      $('reactBar').classList.remove('hidden');
    } else {
      $('voteArea').classList.remove('hidden');
      box.classList.remove('locked');
      $('voteBtn').classList.remove('hidden');
    }
  } else if (s.status === 'ended') {
    st.innerHTML = `<h3>Voting ඉවරයි!</h3><div class="muted">Big screen එකේ reveal එක බලාගෙන ඉන්න</div>`;
    $('reactBar').classList.remove('hidden');
  } else if (s.status === 'revealed') {
    if (window.drum) window.drum.pause();
    st.innerHTML = `<h3>Results</h3>`;
    FX.renderResults($('results'), question, s);
    if (!revealedShown) { revealedShown = true; FX.revealShow(s); }
  }
}

init();
</script>
</body>
</html>
